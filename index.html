<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังของฟร้อง Pro 5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; transition: background 0.5s ease-in-out; background-size: cover; background-position: center; min-height: 100vh; background-attachment: fixed; }
        .glass-morphism { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .gold-card { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="mainBody" style="background-image: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=1200');">

    <div class="fixed top-4 right-4 z-50">
        <select onchange="changeBg(this.value)" class="p-2 text-xs bg-white/90 rounded-full shadow-lg border-none focus:ring-2 focus:ring-yellow-500">
            <option value="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=1200">✨ ธีมทอง Luxury</option>
            <option value="https://images.unsplash.com/photo-1557683316-973673baf926?w=1200">🌌 ธีมน้ำเงินม่วง</option>
            <option value="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1200">🖤 ธีมดาร์คเท่ๆ</option>
            <option value="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=1200">🌸 ธีมดอกไม้สดใส</option>
        </select>
    </div>

    <div class="max-w-md mx-auto mb-6 pt-12 flex gap-2 px-4">
        <button onclick="switchPage('admin')" class="flex-1 py-3 rounded-2xl bg-yellow-500 text-white font-bold shadow-lg transform active:scale-95 transition">📝 บันทึกใหม่</button>
        <button onclick="loadManagePage()" class="flex-1 py-3 rounded-2xl bg-gray-900 text-white font-bold shadow-lg transform active:scale-95 transition">🔍 จัดการคลัง</button>
    </div>

    <div id="adminPage" class="max-w-md mx-auto glass-morphism p-6 rounded-[32px] shadow-2xl mx-4 fade-in">
        <h1 class="text-2xl font-bold text-[#B8860B] mb-6 flex items-center gap-2">📸 บันทึกลูกหนี้</h1>
        
        <div class="space-y-4 text-center">
            <div class="relative inline-block">
                <div id="imagePreview" onclick="document.getElementById('fileInput').click()" class="w-28 h-28 bg-white/50 rounded-full mx-auto flex items-center justify-center cursor-pointer border-4 border-white shadow-md overflow-hidden hover:scale-105 transition">
                    <span class="text-gray-400 text-[10px]">แตะเพื่อเพิ่มรูปหน้า</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(event)">
            </div>

            <input type="text" id="name" class="w-full p-4 bg-white/50 rounded-2xl border-none focus:ring-2 focus:ring-yellow-500" placeholder="ชื่อลูกหนี้">
            <input type="text" id="amount" inputmode="decimal" class="w-full p-4 bg-white/50 rounded-2xl border-none text-xl font-bold text-yellow-600" placeholder="ยอดเงิน (คืนเงินใส่ -)">
            <input type="text" id="detail" class="w-full p-4 bg-white/50 rounded-2xl border-none" placeholder="รายละเอียด/ยืมจากไหน">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-red-500 font-bold block mb-1">วันคืนเงิน *</label>
                    <input type="date" id="dueDate" class="w-full p-3 bg-red-50/50 rounded-xl text-sm border-none">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 block mb-1">เวลาเตือน</label>
                    <input type="time" id="remindTime" value="09:00" class="w-full p-3 bg-white/50 rounded-xl text-sm border-none">
                </div>
            </div>
            
            <button onclick="saveToCloud()" id="btnSave" class="w-full gold-card text-white py-4 rounded-2xl font-bold shadow-lg mt-4 transform active:scale-95 transition">บันทึกเข้าคลัง 🚀</button>
        </div>
    </div>

    <div id="managePage" class="hidden max-w-2xl mx-auto glass-morphism p-6 rounded-[32px] shadow-2xl mx-4 fade-in">
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-4">🔍 ค้นหารายคน</h2>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <select id="filterName" onchange="renderManageData()" class="p-3 bg-white/50 rounded-xl text-sm border-none focus:ring-2 focus:ring-yellow-500"></select>
                <select id="filterTime" onchange="renderManageData()" class="p-3 bg-white/50 rounded-xl text-sm border-none focus:ring-2 focus:ring-yellow-500">
                    <option value="all">ทั้งหมด (3 เดือน)</option>
                    <option value="today">วันนี้</option>
                    <option value="month">เดือนนี้</option>
                </select>
            </div>
            <div class="bg-yellow-500/90 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
                <span class="text-sm">ยอดค้างของกลุ่มที่เลือก:</span>
                <span class="text-xl font-bold">฿ <span id="dashTotal">0</span></span>
            </div>
        </div>
        <div id="manageContent" class="space-y-3 max-h-[450px] overflow-y-auto pr-1"></div>
    </div>

    <div id="invoicePage" class="hidden max-w-sm mx-auto mt-6 text-center px-4 fade-in">
        <div class="glass-morphism rounded-[40px] shadow-2xl p-8 border-4 border-white relative overflow-hidden">
            <div id="debtorPhoto" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-yellow-400 shadow-md bg-cover bg-center hidden"></div>
            <h2 class="text-2xl font-bold text-[#B8860B]">คลังของฟร้อง</h2>
            <div class="bg-white/60 rounded-3xl py-6 my-6 shadow-inner">
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">ยอดที่ต้องคืนเข้าคลัง</p>
                <div class="text-4xl font-bold text-yellow-600 mt-2">฿ <span id="displayAmount">0</span></div>
            </div>
            <img id="qrImage" src="" class="mx-auto w-48 h-48 rounded-2xl mb-6 shadow-md border-4 border-white">
            <button onclick="switchPage('thankYou')" class="w-full gold-card text-white py-4 rounded-2xl font-bold shadow-lg">โอนเรียบร้อย ✅</button>
        </div>
    </div>

    <div id="thankYouPage" class="hidden text-center mt-20 fade-in">
        <div class="text-8xl mb-6">💖</div>
        <h2 class="text-3xl font-bold text-white shadow-lg">ได้รับเงินแล้วจ้า!</h2>
        <button onclick="notifyFong()" class="mt-8 bg-[#06C755] text-white px-8 py-3 rounded-full font-bold shadow-lg">แจ้งฟร้องใน LINE 📱</button>
    </div>

    <script>
        const PROMPTPAY_ID = "0924499440"; 
        const SCRIPT_URL = "YOUR_SCRIPT_URL_HERE"; // *** แปะ URL ใหม่ที่นี่ ***
        let rawData = [];
        let base64Image = "";

        // เปลี่ยนพื้นหลัง
        function changeBg(url) { document.getElementById('mainBody').style.backgroundImage = `url('${url}')`; }

        // จัดการรูปภาพ
        function handleFile(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${base64Image}" class="w-full h-full object-cover">`;
            }
            reader.readAsDataURL(file);
        }

        // ระบบเปลี่ยนหน้า
        function switchPage(page) {
            ['adminPage', 'managePage', 'invoicePage', 'thankYouPage'].forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(page + 'Page').classList.remove('hidden');
        }

        // ดึงข้อมูลจาก URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('name') && urlParams.get('amount')) {
            switchPage('invoice');
            document.getElementById('displayAmount').innerText = Number(urlParams.get('amount')).toLocaleString();
            document.getElementById('qrImage').src = `https://promptpay.io/${PROMPTPAY_ID}/${urlParams.get('amount')}.png`;
        }

        // บันทึกลง Cloud
        async function saveToCloud() {
            const name = document.getElementById('name').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const dueDate = document.getElementById('dueDate').value;
            const detail = document.getElementById('detail').value;

            if (!name || isNaN(amount) || !dueDate) return alert("⚠️ กรุณาใส่ชื่อ ยอดเงิน และวันคืนให้ครบ!");

            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerText = "กำลังบันทึกรูป... ⏳";
            
            try {
                await fetch(SCRIPT_URL, { 
                    method: 'POST', mode: 'no-cors', 
                    body: JSON.stringify({ name, amount, dueDate, detail, image: base64Image, remindTime: document.getElementById('remindTime').value }) 
                });
                alert("✅ บันทึกข้อมูลและรูปถ่ายเรียบร้อย!"); location.reload();
            } catch (e) { alert("เกิดข้อผิดพลาด!"); btn.disabled = false; }
        }

        // โหลดข้อมูลจัดการ
        async function loadManagePage() {
            switchPage('manage');
            const container = document.getElementById('manageContent');
            container.innerHTML = '<div class="text-center py-10 text-white">กำลังโหลดรูปภาพและข้อมูล... ⏳</div>';
            
            try {
                const res = await fetch(SCRIPT_URL);
                rawData = await res.json();
                
                const names = [...new Set(rawData.map(i => i.name))];
                const select = document.getElementById('filterName');
                select.innerHTML = '<option value="all">ลูกหนี้ทุกคน</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
                renderManageData();
            } catch (e) { container.innerHTML = '<div class="text-white text-center">โหลดไม่สำเร็จ</div>'; }
        }

        // กรองและแสดงข้อมูล
        function renderManageData() {
            const nameFilter = document.getElementById('filterName').value;
            const timeFilter = document.getElementById('filterTime').value;
            const container = document.getElementById('manageContent');
            const now = new Date();
            
            let filtered = rawData.filter(i => (nameFilter === 'all' || i.name === nameFilter));
            if (timeFilter === 'today') filtered = filtered.filter(i => new Date(i.date).toDateString() === now.toDateString());
            else if (timeFilter === 'month') filtered = filtered.filter(i => new Date(i.date).getMonth() === now.getMonth());

            let total = 0;
            container.innerHTML = filtered.length ? '' : '<p class="text-center py-10 text-white/50">ไม่มีประวัติ</p>';
            
            filtered.reverse().forEach(item => {
                const amt = parseFloat(item.amount);
                total += amt;
                const card = document.createElement('div');
                card.className = "p-4 bg-white/70 rounded-2xl flex justify-between items-center shadow-sm border border-white/50 mb-3";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-gray-200 overflow-hidden border-2 border-white shadow-inner flex-shrink-0">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="text-[8px] text-gray-400 mt-4 text-center">ไม่มีรูป</div>`}
                        </div>
                        <div class="overflow-hidden">
                            <p class="font-bold text-gray-800 truncate">${item.name}</p>
                            <p class="text-[9px] text-gray-500">${new Date(item.date).toLocaleDateString('th-TH')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold ${amt < 0 ? 'text-green-600' : 'text-red-600'} text-sm">${amt.toLocaleString()}</span>
                        <button onclick="deleteRow(${item.row})" class="text-gray-300 hover:text-red-500 p-1">🗑️</button>
                    </div>`;
                container.appendChild(card);
            });
            document.getElementById('dashTotal').innerText = total.toLocaleString();
        }

        async function deleteRow(row) {
            if (!confirm("ลบประวัติและรูปของรายการนี้?")) return;
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", row }) });
            alert("ลบสำเร็จ!"); loadManagePage();
        }

        function notifyFong() { window.open(`https://line.me/R/msg/text/?${encodeURIComponent("ฟร้องจ๋า เค้าโอนคืนคลังเรียบร้อยแล้วน้า เช็คยอดได้เลย! ✅")}`); }
    </script>
</body>
</html>
