<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังของฟร้อง - ระบบจัดการลูกหนี้</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #FFFDF5; }
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 100%); }
    </style>
</head>
<body class="p-4">

    <div id="invoicePage" class="hidden max-w-sm mx-auto mt-10">
        <div class="bg-white rounded-[40px] shadow-2xl overflow-hidden border-4 border-[#F3E5AB] p-8 text-center">
            <div class="text-6xl mb-4">🏠</div>
            <h2 class="text-2xl font-bold text-[#B8860B]">คลังของฟร้อง</h2>
            <p class="text-gray-500 text-sm mb-6">แวะมาสะกิดยอดค้างชำระจ้า ✨</p>
            
            <div class="bg-[#FFFDF5] rounded-3xl py-6 mb-6 shadow-inner">
                <span class="text-xs text-gray-400 uppercase tracking-widest">ยอดที่ต้องคืนเข้าคลัง</span>
                <div class="text-4xl font-bold text-[#D4AF37] mt-2">฿ <span id="displayAmount">0</span></div>
            </div>

            <img id="qrImage" src="" class="mx-auto w-48 h-48 rounded-2xl border-4 border-white shadow-md mb-4">
            <p class="text-[10px] text-gray-400 mb-6">สแกนผ่านแอปธนาคารได้เลยน้า 🙏</p>

            <button onclick="showThankYou()" class="w-full gold-gradient text-white py-4 rounded-2xl font-bold shadow-lg hover:scale-105 transition">
                โอนเรียบร้อยแล้ว ✅
            </button>
        </div>
    </div>

    <div id="thankYouPage" class="hidden text-center mt-20">
        <div class="text-8xl mb-6">💖</div>
        <h2 class="text-3xl font-bold text-[#D4AF37]">ได้รับเรียบร้อย!</h2>
        <p class="text-gray-600 mt-2">ขอบคุณที่คืนเงินเข้าคลังของฟร้องน้าา</p>
        <button onclick="notifyFong()" class="mt-8 bg-[#06C755] text-white px-8 py-3 rounded-full font-bold flex items-center mx-auto">
            แจ้งฟร้องใน LINE 📱
        </button>
    </div>

    <div id="adminPage" class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
        <h1 class="text-2xl font-bold text-[#B8860B] mb-6 flex items-center">
            💰 บันทึกเข้าคลังฟร้อง
        </h1>
        
        <div class="space-y-4">
            <textarea id="note" class="w-full p-4 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-[#D4AF37]" rows="2" placeholder="พิมพ์เช่น: พี่เก่ง ยืม 500"></textarea>
            
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="dueDate" class="p-3 bg-gray-50 rounded-xl text-sm border-none">
                <input type="time" id="remindTime" class="p-3 bg-gray-50 rounded-xl text-sm border-none">
            </div>

            <button onclick="saveToCloud()" id="btnSave" class="w-full bg-[#D4AF37] text-white py-4 rounded-2xl font-bold shadow-lg">
                บันทึกและตั้งเตือนปฏิทิน 🚀
            </button>
        </div>
    </div>

    <script>
        // *** แก้ไขข้อมูลตรงนี้ ***
        const PROMPTPAY_ID = "0924499440"; // ใส่เลขพร้อมเพย์ของฟร้อง
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwn1QzofMDE6YpGfOxtD47iaSlRHamr1LBK2gkz2NfyA3r_ymsebovhff6B0sZPRFucgA/exec"; 
        
        // เช็ค Parameter ใน URL
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const amount = urlParams.get('amount');

        if (name && amount) {
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('invoicePage').classList.remove('hidden');
            document.getElementById('displayAmount').innerText = Number(amount).toLocaleString();
            document.getElementById('qrImage').src = `https://promptpay.io/${PROMPTPAY_ID}/${amount}.png`;
        }

        async function saveToCloud() {
            const btn = document.getElementById('btnSave');
            const note = document.getElementById('note').value;
            const amountMatch = note.match(/\d+/);
            
            if(!note || !amountMatch) return alert("รบกวนระบุข้อมูลให้ครบจ้า");
            
            btn.disabled = true;
            btn.innerText = "กำลังบันทึก... ⏳";

            const data = {
                name: note.split(' ')[0],
                amount: amountMatch[0],
                note: note,
                dueDate: document.getElementById('dueDate').value || new Date().toISOString().split('T')[0],
                remindTime: document.getElementById('remindTime').value || "09:00"
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                alert("บันทึกเข้าคลังและตั้งเตือนเรียบร้อยจ้า! ✨");
                location.reload();
            } catch (e) {
                alert("เกิดข้อผิดพลาด ลองเช็ค URL ของ Script น้า");
                btn.disabled = false;
            }
        }

        function showThankYou() {
            document.getElementById('invoicePage').classList.add('hidden');
            document.getElementById('thankYouPage').classList.remove('hidden');
        }

        function notifyFong() {
            const msg = "ฟร้องจ๋า เค้าโอนเงินคืนเข้าคลังเรียบร้อยแล้วน้า เช็คยอดได้เลย! ✅";
            window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
