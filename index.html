<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังของฟร้อง Pro 6.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; transition: background 0.5s; background-size: cover; background-position: center; min-height: 100vh; background-attachment: fixed; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .gold-card { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .avatar-slot { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; cursor: pointer; transition: 0.3s; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .type-btn { transition: 0.3s; border: 2px solid transparent; }
        .type-active-red { background-color: #ef4444; color: white; border-color: #b91c1c; transform: scale(1.05); }
        .type-active-green { background-color: #22c55e; color: white; border-color: #15803d; transform: scale(1.05); }
    </style>
</head>
<body id="mainBody">

    <div class="fixed top-4 right-4 z-50 flex gap-2">
        <input type="file" id="bgInput" accept="image/*" class="hidden" onchange="changeCustomBg(event)">
        <button onclick="document.getElementById('bgInput').click()" class="p-2 bg-black/50 text-white rounded-full text-[10px] shadow-lg">🖼️ เปลี่ยนพื้นหลัง</button>
    </div>

    <div class="max-w-md mx-auto mb-4 pt-10 px-4">
        <div class="flex gap-2">
            <button onclick="switchPage('admin')" class="flex-1 py-3 rounded-2xl bg-yellow-500 text-white font-bold shadow-lg">📝 บันทึก</button>
            <button onclick="loadManagePage()" class="flex-1 py-3 rounded-2xl bg-gray-900 text-white font-bold shadow-lg">🔍 จัดการ</button>
        </div>
    </div>

    <div id="adminPage" class="max-w-md mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4 mb-10">
        <h2 class="text-sm font-bold text-[#B8860B] mb-3">⭐ ลูกหนี้รายโปรด (แตะเพื่อเลือก)</h2>
        <div id="favoriteList" class="flex gap-4 overflow-x-auto pb-4 mb-4 scrollbar-hide"></div>

        <div class="space-y-4">
            <div class="text-center">
                <div id="imagePreview" onclick="document.getElementById('fileInput').click()" class="w-24 h-24 bg-gray-200 rounded-full mx-auto flex items-center justify-center cursor-pointer border-4 border-white shadow-md overflow-hidden bg-cover bg-center">
                    <span id="picLabel" class="text-[10px] text-gray-500">เลือกรูป</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleDebtorPic(event)">
            </div>

            <input type="text" id="name" class="w-full p-4 bg-white/50 rounded-2xl border-none shadow-sm" placeholder="ชื่อลูกหนี้">
            
            <div class="flex gap-2">
                <button id="btnBorrow" onclick="setEntryType('borrow')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 type-btn type-active-red">ยืม (+)</button>
                <button id="btnReturn" onclick="setEntryType('return')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 type-btn">คืน (-)</button>
            </div>

            <input type="number" id="amount" class="w-full p-4 bg-white/50 rounded-2xl border-none text-2xl font-bold text-center" placeholder="0.00">
            <input type="text" id="detail" class="w-full p-4 bg-white/50 rounded-2xl border-none" placeholder="รายละเอียด">
            
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="dueDate" class="p-3 bg-red-50/50 rounded-xl text-sm border-none">
                <input type="time" id="remindTime" value="09:00" class="p-3 bg-white/50 rounded-xl text-sm border-none">
            </div>
            
            <button onclick="saveToCloud()" id="btnSave" class="w-full gold-card text-white py-4 rounded-2xl font-bold shadow-lg transform active:scale-95 transition">บันทึกข้อมูล 🚀</button>
        </div>
    </div>

    <div id="managePage" class="hidden max-w-2xl mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4">
        <div class="flex justify-between items-center mb-6">
            <select id="filterName" onchange="renderManageData()" class="p-2 bg-white/50 rounded-xl text-xs border-none"></select>
            <div class="text-right"><p class="text-xl font-bold text-red-600">฿ <span id="dashTotal">0</span></p></div>
        </div>
        <div id="manageContent" class="space-y-3 max-h-[450px] overflow-y-auto"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFZN8vLeTBL3h-xSgG8tvVHSLNbzCoYSUyjsn1oHROenrdoYOjVsbEj1jVTxkZuaK5ug/exec";
        let masterData = { logs: [], profiles: {} };
        let debtorImage = "";
        let entryType = "borrow"; // ค่าเริ่มต้นคือ ยืม

        function setEntryType(type) {
            entryType = type;
            document.getElementById('btnBorrow').className = `flex-1 py-3 rounded-xl font-bold type-btn ${type === 'borrow' ? 'type-active-red' : 'bg-white text-gray-400'}`;
            document.getElementById('btnReturn').className = `flex-1 py-3 rounded-xl font-bold type-btn ${type === 'return' ? 'type-active-green' : 'bg-white text-gray-400'}`;
            document.getElementById('amount').style.color = (type === 'borrow') ? '#ef4444' : '#22c55e';
        }

        if(localStorage.getItem('fongBg')) document.body.style.backgroundImage = `url('${localStorage.getItem('fongBg')}')`;
        function changeCustomBg(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.body.style.backgroundImage = `url('${event.target.result}')`;
                localStorage.setItem('fongBg', event.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function handleDebtorPic(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                debtorImage = ev.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${debtorImage}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        async function fetchInitialData() {
            try {
                const res = await fetch(SCRIPT_URL);
                masterData = await res.json();
                const favDiv = document.getElementById('favoriteList');
                favDiv.innerHTML = '';
                Object.keys(masterData.profiles).forEach(name => {
                    const img = masterData.profiles[name];
                    const div = document.createElement('div');
                    div.className = "text-center flex-shrink-0";
                    div.onclick = () => {
                        document.getElementById('name').value = name;
                        debtorImage = img;
                        document.getElementById('imagePreview').innerHTML = `<img src="${img}" class="w-full h-full object-cover">`;
                    };
                    div.innerHTML = `<div class="avatar-slot bg-cover bg-center" style="background-image:url('${img}')"></div><p class="text-[9px] mt-1 font-bold text-gray-600">${name}</p>`;
                    favDiv.appendChild(div);
                });
            } catch(e) {}
        }

        async function saveToCloud() {
            const name = document.getElementById('name').value;
            let amount = parseFloat(document.getElementById('amount').value);
            const dueDate = document.getElementById('dueDate').value;
            if(!name || isNaN(amount) || !dueDate) return alert("กรอกข้อมูลไม่ครบ");

            // ถ้าเลือกเป็น "คืน" ให้แปลงค่าเป็นติดลบทันที
            if(entryType === 'return' && amount > 0) amount = -amount;

            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerText = "กำลังบันทึก...";
            await fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ name, amount, dueDate, detail: document.getElementById('detail').value, image: debtorImage, remindTime: document.getElementById('remindTime').value })
            });
            alert("บันทึกสำเร็จ!"); location.reload();
        }

        function switchPage(p) {
            document.getElementById('adminPage').classList.toggle('hidden', p !== 'admin');
            document.getElementById('managePage').classList.toggle('hidden', p !== 'manage');
        }

        async function loadManagePage() {
            switchPage('manage');
            const res = await fetch(SCRIPT_URL);
            masterData = await res.json();
            const names = [...new Set(masterData.logs.map(i => i.name))];
            document.getElementById('filterName').innerHTML = '<option value="all">ทุกคน</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            renderManageData();
        }

        function renderManageData() {
            const filter = document.getElementById('filterName').value;
            const container = document.getElementById('manageContent');
            container.innerHTML = ''; let total = 0;
            masterData.logs.filter(i => filter === 'all' || i.name === filter).reverse().forEach(item => {
                total += parseFloat(item.amount);
                const card = document.createElement('div');
                card.className = "p-3 bg-white/70 rounded-2xl flex justify-between items-center shadow-sm mb-2";
                card.innerHTML = `<div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-cover bg-center" style="background-image:url('${item.image}')"></div>
                    <div><p class="text-sm font-bold">${item.name}</p><p class="text-[9px] text-gray-400">${item.detail}</p></div>
                </div>
                <div class="text-right">
                    <p class="font-bold ${item.amount < 0 ? 'text-green-500' : 'text-red-500'}">${item.amount}</p>
                    <button onclick="deleteRow(${item.row})" class="text-[10px] text-gray-300">ลบ</button>
                </div>`;
                container.appendChild(card);
            });
            document.getElementById('dashTotal').innerText = total.toLocaleString();
        }

        async function deleteRow(row) {
            if(!confirm("ลบรายการนี้?")) return;
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", row }) });
            loadManagePage();
        }

        fetchInitialData();
    </script>
</body>
</html>
