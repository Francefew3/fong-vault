<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คลังของฟร้อง Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; transition: background 0.6s ease; background-size: cover; background-position: center; min-height: 100vh; background-attachment: fixed; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.4); }
        .gold-card { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .avatar-slot { width: 60px; height: 60px; border-radius: 50%; border: 3px solid white; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; }
        .type-active-red { background-color: #ef4444 !important; color: white !important; }
        .type-active-green { background-color: #22c55e !important; color: white !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body id="mainBody">

    <div class="fixed top-4 right-4 z-50">
        <input type="file" id="bgInput" accept="image/*" class="hidden" onchange="changeCustomBg(event)">
        <button onclick="document.getElementById('bgInput').click()" class="p-2 bg-black/40 text-white rounded-full text-[10px] backdrop-blur-md shadow-lg border border-white/20">🖼️ เปลี่ยนวอลเปเปอร์</button>
    </div>

    <div class="max-w-md mx-auto mb-4 pt-10 px-4 flex gap-2">
        <button onclick="switchPage('admin')" class="flex-1 py-3 rounded-2xl bg-yellow-500 text-white font-bold shadow-lg">📝 บันทึก</button>
        <button onclick="loadManagePage()" class="flex-1 py-3 rounded-2xl bg-gray-900 text-white font-bold shadow-lg">🔍 ดูคลัง</button>
    </div>

    <div id="adminPage" class="max-w-md mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4 mb-10">
        <h2 class="text-xs font-bold text-[#B8860B] mb-3 uppercase tracking-widest">⭐ ลูกหนี้รายโปรด</h2>
        <div id="favoriteList" class="flex gap-4 overflow-x-auto pb-4 mb-4 scrollbar-hide text-gray-400 text-[10px]">
            ไม่มีรายชื่อโปรด
        </div>

        <div class="space-y-4">
            <div class="text-center">
                <div id="imagePreview" onclick="document.getElementById('fileInput').click()" class="w-24 h-24 bg-gray-200 rounded-full mx-auto flex items-center justify-center cursor-pointer border-4 border-white shadow-md overflow-hidden bg-cover bg-center">
                    <span id="picLabel" class="text-[10px] text-gray-500">แตะเพิ่มรูป</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleDebtorPic(event)">
            </div>

            <input type="text" id="name" class="w-full p-4 bg-white/60 rounded-2xl border-none shadow-inner" placeholder="ชื่อลูกหนี้">
            
            <div class="flex gap-2">
                <button id="btnBorrow" onclick="setEntryType('borrow')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 border border-gray-100 type-active-red">ยืม (+)</button>
                <button id="btnReturn" onclick="setEntryType('return')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 border border-gray-100">คืน (-)</button>
            </div>

            <input type="number" id="amount" class="w-full p-4 bg-white/60 rounded-2xl border-none text-2xl font-bold text-center" placeholder="0.00">
            <input type="text" id="detail" class="w-full p-4 bg-white/60 rounded-2xl border-none shadow-inner" placeholder="รายละเอียด">
            
            <div class="grid grid-cols-2 gap-4">
                <input type="date" id="dueDate" class="p-3 bg-red-50/50 rounded-xl text-sm border-none">
                <input type="time" id="remindTime" value="09:00" class="p-3 bg-white/60 rounded-xl text-sm border-none">
            </div>
            
            <button onclick="saveToCloud()" id="btnSave" class="w-full gold-card text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">บันทึกเข้าคลัง 🚀</button>
        </div>
    </div>

    <div id="managePage" class="hidden max-w-2xl mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4 mb-10">
        <div class="flex justify-between items-center mb-6">
            <select id="filterName" onchange="renderManageData()" class="p-2 bg-white/60 rounded-xl text-xs border-none"></select>
            <div class="text-right">
                <p class="text-[10px] text-gray-400">ยอดรวม</p>
                <p class="text-xl font-bold text-red-600">฿ <span id="dashTotal">0</span></p>
            </div>
        </div>
        <div id="manageContent" class="space-y-3 max-h-[450px] overflow-y-auto pr-1 scrollbar-hide"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIrUCpeytuGbUufgaZY4ENCwwI_uaki4JqrtqS6yDa-c9CAzpyV3wdOy1eYE2kWhLB/exec"; 
        let cachedData = null; 
        let debtorImage = "";
        let entryType = "borrow";

        // 1. ระบบวอลเปเปอร์ (จำค่าไว้ในเครื่อง)
        if(localStorage.getItem('fongBg')) document.body.style.backgroundImage = `url('${localStorage.getItem('fongBg')}')`;
        function changeCustomBg(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.body.style.backgroundImage = `url('${event.target.result}')`;
                localStorage.setItem('fongBg', event.target.result);
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        // 2. ระบบบีบอัดรูปภาพขั้นสุด (Ultra-Small 120px JPEG)
        function handleDebtorPic(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 120;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * (MAX_WIDTH / img.width);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    debtorImage = canvas.toDataURL('image/jpeg', 0.4); // บีบอัด 40%
                    document.getElementById('imagePreview').innerHTML = `<img src="${debtorImage}" class="w-full h-full object-cover">`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setEntryType(type) {
            entryType = type;
            document.getElementById('btnBorrow').classList.toggle('type-active-red', type === 'borrow');
            document.getElementById('btnReturn').classList.toggle('type-active-green', type === 'return');
            document.getElementById('amount').style.color = (type === 'borrow') ? '#ef4444' : '#22c55e';
        }

        // 3. จัดการข้อมูล
        async function fetchInitialData(force = false) {
            if (!force && cachedData) return cachedData;
            const res = await fetch(SCRIPT_URL);
            cachedData = await res.json();
            renderFavorites();
            return cachedData;
        }

        function renderFavorites() {
            const favDiv = document.getElementById('favoriteList');
            favDiv.innerHTML = '';
            const profiles = cachedData.profiles;
            if (Object.keys(profiles).length === 0) { favDiv.innerText = 'ไม่มีรายชื่อโปรด'; return; }
            Object.keys(profiles).forEach(name => {
                const img = profiles[name];
                const div = document.createElement('div');
                div.className = "text-center flex-shrink-0 animate-pulse"; // เพิ่มลูกเล่นตอนโหลด
                div.onclick = () => {
                    document.getElementById('name').value = name;
                    debtorImage = img;
                    document.getElementById('imagePreview').innerHTML = `<img src="${img}" class="w-full h-full object-cover">`;
                    div.classList.remove('animate-pulse');
                };
                div.innerHTML = `<div class="avatar-slot bg-cover bg-center" style="background-image:url('${img}')"></div><p class="text-[9px] mt-1 font-bold text-gray-700">${name}</p>`;
                favDiv.appendChild(div);
                setTimeout(() => div.classList.remove('animate-pulse'), 500);
            });
        }

        async function saveToCloud() {
            const name = document.getElementById('name').value.trim();
            let amount = parseFloat(document.getElementById('amount').value);
            const dueDate = document.getElementById('dueDate').value;
            if(!name || isNaN(amount) || !dueDate) return alert("กรอกข้อมูลให้ครบก่อนครับฟร้อง");

            if(entryType === 'return' && amount > 0) amount = -amount;

            const btn = document.getElementById('btnSave');
            btn.disabled = true; btn.innerText = "กำลังบันทึก... ⏳";
            
            await fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ name, amount, dueDate, detail: document.getElementById('detail').value, image: debtorImage, remindTime: document.getElementById('remindTime').value })
            });
            cachedData = null;
            location.reload();
        }

        function switchPage(p) {
            document.getElementById('adminPage').classList.toggle('hidden', p !== 'admin');
            document.getElementById('managePage').classList.toggle('hidden', p !== 'manage');
        }

        async function loadManagePage() {
            switchPage('manage');
            const container = document.getElementById('manageContent');
            container.innerHTML = '<p class="text-center py-10 opacity-50 text-xs">กำลังจูนข้อมูล... ⏳</p>';
            await fetchInitialData(true);
            const names = [...new Set(cachedData.logs.map(i => i.name))];
            document.getElementById('filterName').innerHTML = '<option value="all">ทุกคน</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
            renderManageData();
        }

        function renderManageData() {
            const filter = document.getElementById('filterName').value;
            const container = document.getElementById('manageContent');
            container.innerHTML = ''; let total = 0;
            const logs = [...cachedData.logs].reverse();
            logs.filter(i => filter === 'all' || i.name === filter).forEach(item => {
                total += parseFloat(item.amount);
                const card = document.createElement('div');
                card.className = "p-3 bg-white/70 rounded-2xl flex justify-between items-center shadow-sm mb-2 border border-white/50";
                card.innerHTML = `<div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-cover bg-center shadow-inner border border-white" style="background-image:url('${item.image}')"></div>
                    <div><p class="text-sm font-bold text-gray-800">${item.name}</p><p class="text-[9px] text-gray-400">${item.detail || '-'}</p></div>
                </div>
                <div class="text-right">
                    <p class="font-bold ${item.amount < 0 ? 'text-green-500' : 'text-red-500'}">${parseFloat(item.amount).toLocaleString()}</p>
                    <button onclick="deleteRow(${item.row})" class="text-[10px] text-red-300">ลบ</button>
                </div>`;
                container.appendChild(card);
            });
            document.getElementById('dashTotal').innerText = total.toLocaleString();
        }

        async function deleteRow(row) {
            if(!confirm("จะลบประวัตินี้จริงๆ หรอ?")) return;
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", row }) });
            cachedData = null;
            loadManagePage();
        }

        fetchInitialData();
    </script>
</body>
</html>
