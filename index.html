<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คลังฟร้อง Pro (Calendar Edit)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; transition: background 0.5s ease; background-size: cover; background-position: center; min-height: 100vh; background-attachment: fixed; background-color: #333; }
        .glass { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); }
        .gold-card { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .avatar-slot { width: 55px; height: 55px; border-radius: 50%; border: 2px solid white; flex-shrink: 0; cursor: pointer; }
        .type-active-red { background-color: #ef4444 !important; color: white !important; }
        .type-active-green { background-color: #22c55e !important; color: white !important; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; color: white; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-white"></div>
        <p class="text-sm">กำลังจดใส่ปฏิทินให้ครับฟร้อง... 🚀</p>
    </div>

    <div class="fixed top-4 right-4 z-50">
        <input type="file" id="bgInput" accept="image/*" class="hidden" onchange="compressAndSetBg(event)">
        <button onclick="document.getElementById('bgInput').click()" class="p-2 bg-black/50 text-white rounded-full text-[10px] backdrop-blur-md shadow-xl border border-white/20">🖼️ เปลี่ยนพื้นหลัง</button>
    </div>

    <div class="max-w-md mx-auto mb-4 pt-10 px-4 flex gap-2">
        <button onclick="switchPage('admin')" class="flex-1 py-3 rounded-2xl bg-yellow-500 text-white font-bold shadow-lg">📝 บันทึก</button>
        <button onclick="loadManagePage()" class="flex-1 py-3 rounded-2xl bg-gray-900 text-white font-bold shadow-lg">🔍 ดูคลัง</button>
    </div>

    <div id="adminPage" class="max-w-md mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4 mb-10">
        <h2 class="text-[10px] font-bold text-[#B8860B] mb-3 uppercase tracking-tighter">⭐ รายชื่อโปรด</h2>
        <div id="favoriteList" class="flex gap-4 overflow-x-auto pb-4 mb-4 scrollbar-hide min-h-[70px]"></div>

        <div class="space-y-4">
            <div class="text-center">
                <div id="imagePreview" onclick="document.getElementById('fileInput').click()" class="w-20 h-20 bg-gray-200 rounded-full mx-auto flex items-center justify-center cursor-pointer border-4 border-white shadow-md overflow-hidden bg-cover bg-center">
                    <span class="text-[10px] text-gray-400">รูปหน้า</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleDebtorPic(event)">
            </div>

            <input type="text" id="name" class="w-full p-4 bg-white/50 rounded-2xl border-none shadow-sm" placeholder="ชื่อคนยืม">
            
            <div class="flex gap-2">
                <button id="btnBorrow" onclick="setEntryType('borrow')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 border border-gray-100 type-active-red">ยืม (+)</button>
                <button id="btnReturn" onclick="setEntryType('return')" class="flex-1 py-3 rounded-xl font-bold bg-white text-gray-400 border border-gray-100">คืน (-)</button>
            </div>

            <input type="number" id="amount" class="w-full p-4 bg-white/50 rounded-2xl border-none text-2xl font-bold text-center" placeholder="0.00">
            <input type="text" id="detail" class="w-full p-4 bg-white/50 rounded-2xl border-none shadow-inner" placeholder="โน้ตเพิ่มเติม">
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-gray-400 ml-2">วันที่ต้องคืน</label>
                    <input type="date" id="dueDate" class="w-full p-3 bg-red-50/80 rounded-xl text-sm border-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-gray-400 ml-2">เวลาแจ้งเตือน</label>
                    <input type="time" id="remindTime" value="09:00" class="w-full p-3 bg-white/50 rounded-xl text-sm border-none">
                </div>
            </div>
            
            <button onclick="saveToCloud()" id="btnSave" class="w-full gold-card text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition">บันทึก & ตั้งเตือน 🚀</button>
        </div>
    </div>

    <div id="managePage" class="hidden max-w-2xl mx-auto glass p-6 rounded-[35px] shadow-2xl mx-4 mb-10">
        <div class="flex justify-between items-center mb-6">
            <select id="filterName" onchange="renderManageData()" class="p-2 bg-white/50 rounded-xl text-xs border-none max-w-[120px]"></select>
            <div class="text-right">
                <p class="text-xl font-bold text-red-600 tracking-tight">฿ <span id="dashTotal">0</span></p>
            </div>
        </div>
        <div id="manageContent" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
    </div>

    <script>
        const SCRIPT_URL = "แปะ_URL_จาก_APPS_SCRIPT_ตรงนี้"; 
        let cachedData = null; 
        let debtorImage = "";
        let entryType = "borrow";

        // BG Setup
        if(localStorage.getItem('fongBg')) document.body.style.backgroundImage = `url('${localStorage.getItem('fongBg')}')`;

        function compressAndSetBg(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * (MAX_WIDTH / img.width);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedBg = canvas.toDataURL('image/jpeg', 0.5);
                    document.body.style.backgroundImage = `url('${compressedBg}')`;
                    localStorage.setItem('fongBg', compressedBg);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleDebtorPic(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 100, 100);
                    debtorImage = canvas.toDataURL('image/jpeg', 0.4);
                    document.getElementById('imagePreview').innerHTML = `<img src="${debtorImage}" class="w-full h-full object-cover">`;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setEntryType(type) {
            entryType = type;
            document.getElementById('btnBorrow').classList.toggle('type-active-red', type === 'borrow');
            document.getElementById('btnReturn').classList.toggle('type-active-green', type === 'return');
        }

        async function fetchInitialData() {
            try {
                const res = await fetch(SCRIPT_URL);
                cachedData = await res.json();
                renderFavorites();
            } catch(e) {}
        }

        function renderFavorites() {
            const favDiv = document.getElementById('favoriteList');
            favDiv.innerHTML = '';
            Object.keys(cachedData.profiles).forEach(name => {
                const div = document.createElement('div');
                div.className = "text-center flex-shrink-0";
                div.onclick = () => {
                    document.getElementById('name').value = name;
                    debtorImage = cachedData.profiles[name];
                    document.getElementById('imagePreview').innerHTML = `<img src="${debtorImage}" class="w-full h-full object-cover">`;
                };
                div.innerHTML = `<div class="avatar-slot bg-cover bg-center" style="background-image:url('${cachedData.profiles[name]}')"></div><p class="text-[9px] mt-1 font-bold text-gray-700">${name}</p>`;
                favDiv.appendChild(div);
            });
        }

        async function saveToCloud() {
            const name = document.getElementById('name').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const dueDate = document.getElementById('dueDate').value;
            if(!name || isNaN(amount) || !dueDate) return alert("กรอกข้อมูลให้ครบนะฟร้อง");

            document.getElementById('loader').style.display = 'flex';
            
            const finalAmount = entryType === 'return' ? -amount : amount;

            await fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ 
                    name, amount: finalAmount, dueDate, 
                    detail: document.getElementById('detail').value, 
                    image: debtorImage, 
                    remindTime: document.getElementById('remindTime').value 
                })
            });
            alert("บันทึกและตั้งทวงเงินในปฏิทินเรียบร้อย!");
            location.reload();
        }

        function switchPage(p) {
            document.getElementById('adminPage').classList.toggle('hidden', p !== 'admin');
            document.getElementById('managePage').classList.toggle('hidden', p !== 'manage');
        }

        async function loadManagePage() {
            switchPage('manage');
            await fetchInitialData();
            renderManageData();
        }

        function renderManageData() {
            const container = document.getElementById('manageContent');
            container.innerHTML = ''; let total = 0;
            const logs = [...cachedData.logs].reverse();
            logs.forEach(item => {
                total += parseFloat(item.amount);
                const card = document.createElement('div');
                card.className = "p-3 bg-white/70 rounded-2xl flex justify-between items-center shadow-sm mb-2 border border-white/50";
                card.innerHTML = `<div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-cover bg-center flex-shrink-0" style="background-image:url('${item.image}')"></div>
                    <div class="truncate"><p class="text-sm font-bold text-gray-800">${item.name}</p></div>
                </div>
                <div class="text-right">
                    <p class="font-bold ${item.amount < 0 ? 'text-green-500' : 'text-red-500'}">${item.amount.toLocaleString()}</p>
                    <button onclick="deleteRow(${item.row})" class="text-[10px] text-red-300">ลบ</button>
                </div>`;
                container.appendChild(card);
            });
            document.getElementById('dashTotal').innerText = total.toLocaleString();
            const names = [...new Set(cachedData.logs.map(i => i.name))];
            document.getElementById('filterName').innerHTML = '<option value="all">ทุกคน</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
        }

        async function deleteRow(row) {
            if(!confirm("ลบรายการนี้?")) return;
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "delete", row }) });
            location.reload();
        }

        fetchInitialData();
    </script>
</body>
</html>
